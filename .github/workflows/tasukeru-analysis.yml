"""Tasukeru detection evidence review (DRAFT_FIX; report-only).

Python 3.11+, standard library only. This tool reads explicitly supplied files
or directories, parses Python as data, and writes JSON to stdout. It does not
import/execute target code, call networks, write files, or alter existing gates,
findings, counts, HITL, STOP, confidence, 4D, PEL, FEI, or PBM.

Examples:
    python tasukeru_detection_review.py --self-test
    python tasukeru_detection_review.py example.py
    python tasukeru_detection_review.py scripts tests
    python tasukeru_detection_review.py --baseline-workflow tasukeru-analysis.yml example.py

The legacy comparison reproduces only the uploaded abuse-pattern text matcher,
not the entire workflow's classifiers or decisions. New results are evidence
for human review, never authorization. Syntax is not a proof of runtime effects.
YAML support is limited to quoted Python heredocs; shell/YAML semantics remain
UNKNOWN. Unsupported, unreadable, invalid, oversized, or symlinked targets are
reported as incomplete, not clean. No raw source or credential values are output.

Provenance: tasukeru-analysis(9).yml, SHA-256
13ff21a87b74e1f5461a25f5810d6fe90452f6d109296decfd16a9131e3f3f13
"""
from __future__ import annotations

import argparse
import ast
import hashlib
import json
import os
import re
import textwrap
from collections import defaultdict
from pathlib import Path
from typing import Any

BASELINE_SHA256 = "13ff21a87b74e1f5461a25f5810d6fe90452f6d109296decfd16a9131e3f3f13"
MAX_BYTES = 2_000_000
SKIP_DIRS = {".git", ".venv", "venv", "__pycache__", ".pytest_cache",
             ".mypy_cache", ".ruff_cache", "archive"}
SUPPORTED_SUFFIXES = {".py", ".yml", ".yaml"}
NETWORK_PATTERNS = (
    r"\brequests\.(post|put|patch|delete)\s*\(",
    r"\burllib\.request\.urlopen\s*\(",
    r"\bhttp\.client\.",
)
CREDENTIAL_PATTERN = r"\b(secret|token|api[_-]?key|password|credential|private[_-]?key)\b"
DESTRUCTIVE_PATTERNS = (
    r"\bshutil\.rmtree\s*\(",
    r"\bos\.(remove|unlink|rmdir)\s*\(",
    r"\.unlink\s*\(",
    r"\brm\s+-rf\b",
)
DYNAMIC_PATTERNS = (
    r"\beval\s*\(",
    r"\bexec\s*\(",
    r"\bsubprocess\.(run|Popen|call)\s*\(",
)
STATE_MARKERS = {"trust_store_path", "grants_store_path", "eval_state_path"}
NETWORK_RE = tuple(re.compile(p, re.I) for p in NETWORK_PATTERNS)
DESTRUCTIVE_RE = tuple(re.compile(p, re.I) for p in DESTRUCTIVE_PATTERNS)
DYNAMIC_RE = tuple(re.compile(p, re.I) for p in DYNAMIC_PATTERNS)
CREDENTIAL_RE = re.compile(CREDENTIAL_PATTERN, re.I)
HEREDOC_RE = re.compile(r"\bpython(?:3)?\s+-\s*<<\s*(['\"])([A-Za-z_][A-Za-z0-9_]*)\1")

POLICY = {
    "status": "DRAFT_FIX",
    "report_only": True,
    "automatic_adoption": False,
    "existing_findings_changed": False,
    "existing_decisions_changed": False,
    "existing_counts_changed": False,
    "feeds_existing_scores": False,
    "approval_verified_by_this_tool": False,
    "human_review_required": True,
    "target_code_executed": False,
    "network_calls": False,
    "file_writes": False,
}


def legacy_candidates(text: str, *, capped: bool = True) -> list[dict[str, Any]]:
    """Reproduce the baseline text matcher, without its path/decision classifier."""
    found: list[dict[str, Any]] = []
    for number, line in enumerate(text.splitlines(), 1):
        stripped = line.strip()
        if not stripped or stripped.startswith("#"):
            continue
        lower = stripped.lower()
        network = any(pattern.search(stripped) for pattern in NETWORK_RE)
        if network and not any(word in lower for word in ("approved", "hitl", "allowlist")):
            found.append({"line": number, "kind": "EXTERNAL_EFFECT"})
        credential = ("_tokens" not in lower and "side_effect_tokens" not in lower
                      and bool(CREDENTIAL_RE.search(stripped)))
        if credential and (network or any(word in lower for word in ("send", "upload", "exfil"))):
            found.append({"line": number, "kind": "CREDENTIAL_REFERENCE"})
        if any(pattern.search(stripped) for pattern in DESTRUCTIVE_RE):
            if ".unlink" in lower and any(marker in lower for marker in STATE_MARKERS):
                found.append({"line": number, "kind": "STATE_RESET_REVIEW"})
            elif not any(word in lower for word in ("tmp_path", "temporary", "test")):
                found.append({"line": number, "kind": "DESTRUCTIVE_EFFECT"})
        if any(pattern.search(stripped) for pattern in DYNAMIC_RE):
            gated = ("subprocess.run" in lower and "nosec" in lower
                     and "hitl-gated" in lower and "shell=false" in lower)
            if gated:
                found.append({"line": number, "kind": "DYNAMIC_REVIEW_ONLY"})
            elif "literal_eval" not in lower and "pytest" not in lower:
                found.append({"line": number, "kind": "DYNAMIC_EXECUTION"})
        if capped and len(found) >= 5:
            break
    return found


def credential_reference(node: ast.AST) -> bool:
    """Lexical references in arguments only; no values or dataflow are exposed."""
    for child in ast.walk(node):
        value = child.id if isinstance(child, ast.Name) else (
            child.attr if isinstance(child, ast.Attribute) else (
                child.value if isinstance(child, ast.Constant)
                and isinstance(child.value, str) else ""
            )
        )
        if CREDENTIAL_RE.search(value) or CREDENTIAL_RE.search(value.replace("_", " ")):
            return True
    return False


class Bindings(ast.NodeVisitor):
    """Gather one lexical scope conservatively; do not enter child scopes."""

    def __init__(self) -> None:
        self.imports: dict[str, set[str]] = defaultdict(set)
        self.blocked: set[str] = set()

    def visit_Import(self, node: ast.Import) -> None:
        for alias in node.names:
            self.imports[alias.asname or alias.name.split(".")[0]].add(
                alias.name if alias.asname else alias.name.split(".")[0]
            )

    def visit_ImportFrom(self, node: ast.ImportFrom) -> None:
        for alias in node.names:
            if alias.name == "*":
                self.blocked.add("*")
            elif node.level:
                self.blocked.add(alias.asname or alias.name)
            else:
                self.imports[alias.asname or alias.name].add(
                    (node.module + "." if node.module else "") + alias.name
                )

    def visit_Name(self, node: ast.Name) -> None:
        if isinstance(node.ctx, (ast.Store, ast.Del)):
            self.blocked.add(node.id)

    def visit_FunctionDef(self, node: ast.FunctionDef) -> None:
        self.blocked.add(node.name)

    visit_AsyncFunctionDef = visit_FunctionDef

    def visit_ClassDef(self, node: ast.ClassDef) -> None:
        self.blocked.add(node.name)

    def visit_Lambda(self, node: ast.Lambda) -> None:
        pass

    def visit_ListComp(self, node: ast.ListComp) -> None:
        pass

    visit_SetComp = visit_ListComp
    visit_DictComp = visit_ListComp
    visit_GeneratorExp = visit_ListComp

    def visit_Global(self, node: ast.Global) -> None:
        self.blocked.update(node.names)

    visit_Nonlocal = visit_Global

    def visit_ExceptHandler(self, node: ast.ExceptHandler) -> None:
        if node.name:
            self.blocked.add(node.name)
        self.generic_visit(node)

    def visit_MatchAs(self, node: ast.MatchAs) -> None:
        if node.name:
            self.blocked.add(node.name)
        self.generic_visit(node)

    def visit_MatchStar(self, node: ast.MatchStar) -> None:
        if node.name:
            self.blocked.add(node.name)

    def visit_MatchMapping(self, node: ast.MatchMapping) -> None:
        if node.rest:
            self.blocked.add(node.rest)
        self.generic_visit(node)


class Scope:
    def __init__(self, body: list[ast.stmt], parent: Scope | None = None,
                 parameters: list[str] | None = None, kind: str = "function") -> None:
        self.parent = parent
        self.kind = kind
        self.bindings = Bindings()
        for statement in body:
            self.bindings.visit(statement)
        self.bindings.blocked.update(parameters or [])

    def resolve(self, name: str) -> tuple[str, str]:
        bindings = self.bindings
        imports = bindings.imports.get(name, set())
        if name in bindings.blocked or "*" in bindings.blocked or len(imports) > 1:
            hint = next(iter(imports)) if len(imports) == 1 else name
            if not imports and self.parent is not None:
                hint, _ = self.parent.resolve(name)
            return hint, "UNKNOWN_SHADOWED_OR_AMBIGUOUS"
        if imports:
            return next(iter(imports)), "IMPORT_SYNTAX_ONLY"
        if self.parent is not None:
            return self.parent.resolve(name)
        if name in {"eval", "exec"}:
            return name, "BUILTIN_NAME_SYNTAX_ONLY"
        return name, "UNKNOWN_BINDING"


def parameter_names(arguments: ast.arguments) -> list[str]:
    return [argument.arg for argument in
            [*arguments.posonlyargs, *arguments.args, *arguments.kwonlyargs,
             *([arguments.vararg] if arguments.vararg else []),
             *([arguments.kwarg] if arguments.kwarg else [])]]


def dotted_name(node: ast.AST, scope: Scope) -> tuple[str, str]:
    if isinstance(node, ast.Name):
        return scope.resolve(node.id)
    if isinstance(node, ast.Attribute):
        root, status = dotted_name(node.value, scope)
        return (root + "." + node.attr if root else ""), status
    return "", "UNKNOWN_DYNAMIC_CALLEE"


def call_family(name: str, node: ast.Call) -> str | None:
    if name in {"requests.post", "requests.put", "requests.patch", "requests.delete",
                "urllib.request.urlopen"} or name.startswith("http.client."):
        return "EXTERNAL_EFFECT"
    if name in {"shutil.rmtree", "os.remove", "os.unlink", "os.rmdir"}:
        return "DESTRUCTIVE_EFFECT"
    if isinstance(node.func, ast.Attribute) and node.func.attr == "unlink":
        return "DESTRUCTIVE_EFFECT"
    if name in {"eval", "exec", "subprocess.run", "subprocess.Popen", "subprocess.call"}:
        return "DYNAMIC_EXECUTION"
    return None


class CallReview(ast.NodeVisitor):
    def __init__(self, tree: ast.Module, text: str) -> None:
        self.scope = Scope(tree.body, kind="module")
        self.text = text
        self.lines = text.splitlines()
        self.calls: list[dict[str, Any]] = []

    def visit_Call(self, node: ast.Call) -> None:
        name, resolution = dotted_name(node.func, self.scope)
        family = call_family(name, node)
        if family:
            first, last = node.lineno, node.end_lineno or node.lineno
            nearby = "\n".join(self.lines[first-1:last]).lower()
            signals = []
            if any(word in nearby for word in ("approved", "hitl", "allowlist")):
                signals.append("ANNOTATION_OR_NAME_IS_NOT_APPROVAL")
            if family == "EXTERNAL_EFFECT" and (
                any(credential_reference(argument) for argument in node.args)
                or any(credential_reference(keyword.value) for keyword in node.keywords)
            ):
                signals.append("CREDENTIAL_REFERENCE_IN_CALL")
            if family == "DESTRUCTIVE_EFFECT" and any(marker in nearby for marker in STATE_MARKERS):
                signals.append("STATE_MARKER_IS_NOT_SAFETY_PROOF")
            if family == "DYNAMIC_EXECUTION" and any(word in nearby for word in ("nosec", "hitl-gated")):
                signals.append("SUPPRESSION_COMMENT_IS_NOT_AUTHORIZATION")
            self.calls.append({
                "line": first,
                "end_line": last,
                "kind": family,
                "callee_family": name if resolution == "IMPORT_SYNTAX_ONLY" else family,
                "binding_status": resolution,
                "evidence_status": "CALL_SYNTAX_ONLY",
                "approval_status": "UNKNOWN",
                "runtime_effect_status": "UNKNOWN",
                "signals": signals,
            })
        self.generic_visit(node)

    def _function(self, node: ast.FunctionDef | ast.AsyncFunctionDef) -> None:
        annotations = [argument.annotation for argument in
                       [*node.args.posonlyargs, *node.args.args, *node.args.kwonlyargs,
                        *([node.args.vararg] if node.args.vararg else []),
                        *([node.args.kwarg] if node.args.kwarg else [])]
                       if argument.annotation is not None]
        for child in [*node.decorator_list, *node.args.defaults,
                      *(value for value in node.args.kw_defaults if value is not None),
                      *annotations, *([node.returns] if node.returns is not None else [])]:
            self.visit(child)
        previous = self.scope
        parent = previous.parent if previous.kind == "class" else previous
        self.scope = Scope(node.body, parent, parameter_names(node.args))
        for statement in node.body:
            self.visit(statement)
        self.scope = previous

    visit_FunctionDef = _function
    visit_AsyncFunctionDef = _function

    def visit_ClassDef(self, node: ast.ClassDef) -> None:
        for child in [*node.decorator_list, *node.bases, *(keyword.value for keyword in node.keywords)]:
            self.visit(child)
        previous = self.scope
        self.scope = Scope(node.body, previous, kind="class")
        for statement in node.body:
            self.visit(statement)
        self.scope = previous

    def visit_Lambda(self, node: ast.Lambda) -> None:
        for child in [*node.args.defaults, *(value for value in node.args.kw_defaults if value is not None)]:
            self.visit(child)
        previous = self.scope
        parent = previous.parent if previous.kind == "class" else previous
        self.scope = Scope([], parent, parameter_names(node.args))
        self.visit(node.body)
        self.scope = previous

    def _comprehension(self, node: ast.AST) -> None:
        previous = self.scope
        # Conservatively mask all comprehension target names; no fabricated binding.
        targets = [child.id for generator in node.generators
                   for child in ast.walk(generator.target) if isinstance(child, ast.Name)]
        self.scope = Scope([], previous, targets)
        self.generic_visit(node)
        self.scope = previous

    visit_ListComp = _comprehension
    visit_SetComp = _comprehension
    visit_DictComp = _comprehension
    visit_GeneratorExp = _comprehension


def parse_review(text: str) -> dict[str, Any]:
    legacy = legacy_candidates(text)
    uncapped = legacy_candidates(text, capped=False)
    try:
        tree = ast.parse(text)
    except (SyntaxError, ValueError, MemoryError, RecursionError) as error:
        return {
            "parse_status": "UNKNOWN",
            "error_type": type(error).__name__,
            "legacy_candidates": legacy,
            "uncapped_text_candidates": uncapped,
            "call_evidence": [],
            "comparison_status": "UNKNOWN",
        }
    review = CallReview(tree, text)
    try:
        review.visit(tree)
    except RecursionError:
        return {
            "parse_status": "UNKNOWN",
            "error_type": "RecursionError",
            "legacy_candidates": legacy,
            "uncapped_text_candidates": uncapped,
            "call_evidence": [],
            "comparison_status": "UNKNOWN",
        }
    calls = sorted(review.calls, key=lambda item: (item["line"], item["end_line"], item["kind"]))
    only_text = [
        {**item, "status": "TEXT_MATCH_WITHOUT_CORRESPONDING_CALL_SYNTAX"}
        for item in uncapped
        if item["kind"] in {"EXTERNAL_EFFECT", "DESTRUCTIVE_EFFECT", "DYNAMIC_EXECUTION"}
        and not any(call["kind"] == item["kind"]
                    and call["line"] <= item["line"] <= call["end_line"] for call in calls)
    ]
    functions = []
    for node in ast.walk(tree):
        if isinstance(node, (ast.FunctionDef, ast.AsyncFunctionDef)):
            functions.append({
                "line": node.lineno,
                "end_line": node.end_lineno,
                "kind": "ASYNC_FUNCTION" if isinstance(node, ast.AsyncFunctionDef) else "FUNCTION",
                "evidence_status": "SYNTACTIC_RANGE_ONLY",
            })
    return {
        "parse_status": "PARSED",
        "legacy_candidates": legacy,
        "uncapped_text_candidates": uncapped,
        "text_candidates_after_legacy_cutoff": uncapped[len(legacy):],
        "call_evidence": calls,
        "text_only_evidence": only_text,
        "function_ranges": sorted(functions, key=lambda item: item["line"]),
        "comparison_status": "SYNTAX_COMPARISON_ONLY",
    }


def python_heredocs(text: str) -> tuple[list[tuple[int, str]], bool]:
    lines = text.splitlines()
    blocks = []
    index = 0
    complete = True
    while index < len(lines):
        match = HEREDOC_RE.search(lines[index])
        if not match:
            index += 1
            continue
        end = index + 1
        marker = match.group(2)
        while end < len(lines) and lines[end].strip() != marker:
            end += 1
        if end == len(lines):
            complete = False
            break
        blocks.append((index + 2, textwrap.dedent("\n".join(lines[index+1:end]))))
        index = end + 1
    return blocks, complete


def verify_baseline(path: Path) -> dict[str, Any]:
    try:
        if path.is_symlink():
            return {"status": "UNKNOWN", "error_type": "SymlinkNotRead"}
    except OSError as error:
        return {"status": "UNKNOWN", "error_type": type(error).__name__}
    try:
        with path.open("rb") as handle:
            raw = handle.read(MAX_BYTES + 1)
    except OSError as error:
        return {"status": "UNKNOWN", "error_type": type(error).__name__}
    if len(raw) > MAX_BYTES:
        return {"status": "UNKNOWN", "error_type": "SizeLimit"}
    digest = hashlib.sha256(raw).hexdigest()
    return {
        "status": "MATCH" if digest == BASELINE_SHA256 else "BASELINE_MISMATCH",
        "sha256": digest,
        "expected_sha256": BASELINE_SHA256,
        "semantics": "Byte identity of the uploaded workflow only; not runtime validation.",
    }


def review_file(path: Path, display_path: str | None = None) -> dict[str, Any]:
    item: dict[str, Any] = {"path": display_path or path.as_posix()}
    try:
        if path.is_symlink():
            return {**item, "status": "UNKNOWN_SYMLINK_NOT_READ", "coverage_complete": False}
    except OSError as error:
        return {**item, "status": "UNKNOWN_METADATA_ERROR", "error_type": type(error).__name__,
                "coverage_complete": False}
    if path.suffix.lower() not in SUPPORTED_SUFFIXES:
        return {**item, "status": "UNKNOWN_UNSUPPORTED_TYPE", "coverage_complete": False}
    try:
        with path.open("rb") as handle:
            raw = handle.read(MAX_BYTES + 1)
    except OSError as error:
        return {**item, "status": "UNKNOWN_READ_ERROR", "error_type": type(error).__name__,
                "coverage_complete": False}
    if len(raw) > MAX_BYTES:
        return {**item, "status": "UNKNOWN_SIZE_LIMIT", "coverage_complete": False}
    try:
        text = raw.decode("utf-8")
    except UnicodeDecodeError:
        return {**item, "status": "UNKNOWN_UTF8_ERROR", "coverage_complete": False}
    item["sha256"] = hashlib.sha256(raw).hexdigest()
    if path.suffix.lower() == ".py":
        analysis = parse_review(text)
        return {**item, "status": "PYTHON_SYNTAX_REVIEW", "coverage_complete":
                analysis["parse_status"] == "PARSED", "analysis": analysis,
                "coverage_semantics": "Only the documented static call families; not all behavior."}
    blocks, closed = python_heredocs(text)
    return {
        **item,
        "status": "PARTIAL_PYTHON_HEREDOC_REVIEW" if blocks else "UNKNOWN_NO_PYTHON_HEREDOC",
        "coverage_complete": False,
        "heredocs_closed": closed,
        "legacy_text_comparison_only": legacy_candidates(text),
        "python_blocks": [{"source_start_line": start, "analysis": parse_review(body)}
                          for start, body in blocks],
        "coverage_semantics": "Shell commands, YAML semantics, and non-heredoc Python are UNKNOWN.",
    }


def build_report(targets: list[Path], baseline_path: Path | None = None) -> dict[str, Any]:
    baseline = verify_baseline(baseline_path) if baseline_path else {
        "status": "NOT_SUPPLIED", "expected_sha256": BASELINE_SHA256}
    if baseline["status"] in {"UNKNOWN", "BASELINE_MISMATCH"}:
        return {"policy": dict(POLICY), "baseline": baseline, "status": "BASELINE_UNRESOLVED",
                "coverage_complete": False, "files": [], "discovery_issues": []}
    files: list[dict[str, Any]] = []
    issues: list[dict[str, str]] = []
    seen: set[str] = set()

    def add(path: Path, display: str | None = None) -> None:
        identity = os.path.abspath(path)
        if identity not in seen:
            seen.add(identity)
            files.append(review_file(path, display))

    for target in targets:
        try:
            symbolic = target.is_symlink()
            directory = target.is_dir() if not symbolic else False
        except OSError:
            issues.append({"path": target.as_posix(), "status": "UNKNOWN_TARGET_METADATA"})
            continue
        if symbolic:
            issues.append({"path": target.as_posix(), "status": "UNKNOWN_SYMLINK_NOT_READ"})
        elif directory:
            def onerror(error: OSError) -> None:
                issues.append({"path": target.as_posix(), "status": "UNKNOWN_DIRECTORY_READ"})
            for root, directories, names in os.walk(target, followlinks=False, onerror=onerror):
                for name in sorted(directories):
                    candidate = Path(root) / name
                    try:
                        symbolic = candidate.is_symlink()
                    except OSError:
                        issues.append({"path": candidate.relative_to(target).as_posix(),
                                       "status": "UNKNOWN_DIRECTORY_METADATA"})
                        symbolic = True
                    if symbolic:
                        issues.append({"path": candidate.relative_to(target).as_posix(),
                                       "status": "UNKNOWN_SYMLINK_NOT_READ"})
                excluded = {issue["path"] for issue in issues}
                directories[:] = sorted(name for name in directories
                                         if name not in SKIP_DIRS
                                         and (Path(root) / name).relative_to(target).as_posix() not in excluded)
                for name in sorted(names):
                    candidate = Path(root) / name
                    if candidate.suffix.lower() in SUPPORTED_SUFFIXES:
                        add(candidate, candidate.relative_to(target).as_posix())
        else:
            add(target)
    complete = bool(files) and not issues and all(item["coverage_complete"] for item in files)
    return {
        "schema_version": "tasukeru-detection-evidence-v1",
        "policy": dict(POLICY),
        "baseline": baseline,
        "status": "REVIEW_EVIDENCE_GENERATED" if complete else "REVIEW_EVIDENCE_INCOMPLETE",
        "coverage_complete": complete,
        "safe_or_approved_conclusion": "NOT_DETERMINED",
        "pr_files_api_completeness": "NOT_CHECKED",
        "scope": {"suffixes": sorted(SUPPORTED_SUFFIXES), "excluded_directories": sorted(SKIP_DIRS),
                  "max_bytes_per_file": MAX_BYTES, "targets": [path.as_posix() for path in targets]},
        "files": files,
        "discovery_issues": issues,
        "limits": [
            "No external authorization, runtime behavior, interprocedural dataflow, or policy adoption is verified.",
            "Bindings are conservative syntax evidence; order, reachability, monkey patching, and runtime types are UNKNOWN.",
            "Text-only evidence is never automatically removed from existing findings.",
            "The legacy matcher comparison omits path-dependent decisions and does not replace the uploaded workflow.",
            "PR API pagination and tool-result completeness require separate evidence and are not checked here.",
        ],
    }


def self_test() -> dict[str, Any]:
    """Deterministic synthetic fixtures; target fixture code is parsed, not run."""
    tests: list[dict[str, Any]] = []

    def check(name: str, ok: bool) -> None:
        tests.append({"name": name, "passed": bool(ok)})

    def calls(text: str) -> list[dict[str, Any]]:
        return parse_review(text).get("call_evidence", [])

    direct = "import requests\nrequests.post(url)\n"
    literal = 'message = "requests.post(url)"\n'
    commented = "import requests\nrequests.post(url)  # HITL\n"
    marker_name = "import requests\nrequests.post(unapproved_url)\n"
    alias = "import requests as rq\nrq.post(url)\n"
    multiline = 'import requests\nrequests.post(\n    url,\n    json={"token": token},\n)\n'
    check("direct_call_retained", len(calls(direct)) == 1)
    check("literal_legacy_match_reproduced", len(legacy_candidates(literal)) == 1)
    check("literal_has_no_call_evidence", calls(literal) == [])
    check("literal_remains_reviewable_text_evidence", len(parse_review(literal)["text_only_evidence"]) == 1)
    check("HITL_comment_legacy_suppression_reproduced", legacy_candidates(commented) == [])
    check("HITL_comment_does_not_prove_approval", calls(commented)[0]["approval_status"] == "UNKNOWN")
    check("unapproved_name_legacy_suppression_reproduced", legacy_candidates(marker_name) == [])
    check("unapproved_name_call_observed", len(calls(marker_name)) == 1)
    check("alias_legacy_miss_reproduced", legacy_candidates(alias) == [])
    check("alias_call_observed", len(calls(alias)) == 1 and calls(alias)[0]["binding_status"] == "IMPORT_SYNTAX_ONLY")
    from_import = "from requests import post as send\nsend(url)\n"
    check("from_import_alias_observed", len(calls(from_import)) == 1)
    check("multiline_credential_legacy_miss_reproduced",
          not any(item["kind"] == "CREDENTIAL_REFERENCE" for item in legacy_candidates(multiline)))
    check("multiline_credential_observed",
          "CREDENTIAL_REFERENCE_IN_CALL" in calls(multiline)[0]["signals"])
    later = "import requests\n" + "\n".join("requests.post(url)" for _ in range(7)) + "\n"
    check("five_hit_legacy_cutoff_reproduced", len(legacy_candidates(later)) == 5)
    check("uncapped_text_reads_later_hits", len(legacy_candidates(later, capped=False)) == 7)
    check("AST_reads_later_calls", len(calls(later)) == 7)
    check("cutoff_delta_is_two", len(parse_review(later)["text_candidates_after_legacy_cutoff"]) == 2)
    unrelated = 'class AuditLog:\n    def emit(self):\n        return None\n\nnote = "sealed raise ValueError"\n'
    ranges = parse_review(unrelated)["function_ranges"]
    check("function_range_excludes_unrelated_text", ranges[0]["end_line"] == 3)
    syntax_error = parse_review("requests.post(\n")
    check("invalid_python_is_UNKNOWN", syntax_error["parse_status"] == "UNKNOWN")
    check("invalid_python_keeps_legacy_evidence", len(syntax_error["legacy_candidates"]) == 1)
    rebound = "import requests\nrequests = other\nrequests.post(url)\n"
    check("rebound_import_is_UNKNOWN", calls(rebound)[0]["binding_status"].startswith("UNKNOWN"))
    parameter = "import requests\ndef operation(requests):\n    requests.post(url)\n"
    check("shadowed_parameter_is_UNKNOWN", calls(parameter)[0]["binding_status"].startswith("UNKNOWN"))
    cross_scope = "def other():\n    import requests as rq\n\nrq.post(url)\n"
    check("import_in_other_scope_not_resolved", calls(cross_scope) == [])
    nested = "import requests as rq\ndef operation():\n    rq.post(url)\n"
    check("module_import_visible_in_function", len(calls(nested)) == 1)
    async_source = "import requests as rq\nasync def operation():\n    rq.post(url)\n"
    check("async_function_supported", len(calls(async_source)) == 1)
    delete = "import os as operating\noperating.remove(path)\n"
    check("destructive_alias_observed", calls(delete)[0]["kind"] == "DESTRUCTIVE_EFFECT")
    dynamic = "import subprocess as child\nchild.run(command, shell=False)  # nosec HITL-gated\n"
    check("dynamic_alias_observed_without_authorization",
          calls(dynamic)[0]["kind"] == "DYNAMIC_EXECUTION"
          and calls(dynamic)[0]["approval_status"] == "UNKNOWN")
    suppressed = "subprocess.run(command, shell=False)  # nosec HITL-gated\n"
    check("legacy_dynamic_downgrade_reproduced", legacy_candidates(suppressed)[0]["kind"] == "DYNAMIC_REVIEW_ONLY")
    reset = "trust_store_path.unlink()\n"
    check("legacy_state_reset_downgrade_reproduced", legacy_candidates(reset)[0]["kind"] == "STATE_RESET_REVIEW")
    get_call = "import requests\nrequests.get(url)\n"
    check("API_family_not_expanded_to_requests_get", calls(get_call) == [])
    after = json.dumps(POLICY, sort_keys=True)
    parse_review(multiline)
    check("policy_not_mutated_by_analysis", json.dumps(POLICY, sort_keys=True) == after)
    serialized = json.dumps(parse_review(
        'import requests\nrequests.post(url, json={"token": "SYNTHETIC_SECRET_SENTINEL"})\n'))
    check("source_and_credential_values_not_output", "SYNTHETIC_SECRET_SENTINEL" not in serialized)
    blocks, closed = python_heredocs("run: |\n  python - <<'PY'\n  import requests\n  requests.post(url)\n  PY\n")
    check("quoted_python_heredoc_parsed", closed and len(blocks) == 1 and len(calls(blocks[0][1])) == 1)
    open_blocks, closed = python_heredocs("python - <<'PY'\nrequests.post(url)\n")
    check("unclosed_heredoc_incomplete", not closed and open_blocks == [])
    scope_class = "import requests as rq\nclass C:\n    rq = other\n    def operation(self):\n        rq.post(url)\n"
    check("method_uses_module_not_class_binding", calls(scope_class)[0]["binding_status"] == "IMPORT_SYNTAX_ONLY")
    compreh = "import requests\n[requests.post(url) for requests in objects]\n"
    check("comprehension_shadowing_is_UNKNOWN", calls(compreh)[0]["binding_status"].startswith("UNKNOWN"))
    check("no_safe_or_approved_conclusion_emitted",
          all(item["approval_status"] == "UNKNOWN" and item["runtime_effect_status"] == "UNKNOWN"
              for item in calls(multiline)))
    api_key = 'import requests\nrequests.post(url, headers={"key": API_KEY})\n'
    check("API_KEY_reference_observed", "CREDENTIAL_REFERENCE_IN_CALL" in calls(api_key)[0]["signals"])
    private_key = 'import requests\nrequests.post(url, json={"key": private_key})\n'
    check("private_key_reference_observed", "CREDENTIAL_REFERENCE_IN_CALL" in calls(private_key)[0]["signals"])
    alias_rebound = "import requests as rq\nrq = other\nrq.post(url)\n"
    check("rebound_alias_remains_UNKNOWN_evidence", calls(alias_rebound)[0]["binding_status"].startswith("UNKNOWN"))
    alias_parameter = "import requests as rq\ndef operation(rq):\n    rq.post(url)\n"
    check("shadowed_alias_remains_UNKNOWN_evidence", calls(alias_parameter)[0]["binding_status"].startswith("UNKNOWN"))
    annotation = "import requests\ndef operation(x: requests.post(url)) -> requests.post(url):\n    pass\n"
    check("annotation_calls_observed_as_syntax_only", len(calls(annotation)) == 2)
    harmless = 'requests_message = "Use the API only after HITL"\n'
    check("ordinary_documentation_has_no_call_evidence", calls(harmless) == [])
    duplicate_import = "import requests as rq\nimport custom as rq\nrq.post(url)\n"
    check("conflicting_import_not_misreported_as_known_requests", calls(duplicate_import) == [])
    # Simulate read failures and special targets in memory; no test files are written.
    import io
    from unittest.mock import patch
    virtual = Path("synthetic_case.py")
    with patch.object(Path, "is_symlink", return_value=False):
        with patch.object(Path, "open", side_effect=FileNotFoundError()):
            check("missing_file_incomplete", review_file(virtual)["status"] == "UNKNOWN_READ_ERROR")
        with patch.object(Path, "open", side_effect=PermissionError()):
            check("unreadable_file_incomplete", not review_file(virtual)["coverage_complete"])
        with patch.object(Path, "open", return_value=io.BytesIO(b"\xff")):
            check("invalid_UTF8_incomplete", review_file(virtual)["status"] == "UNKNOWN_UTF8_ERROR")
        with patch.object(Path, "open", return_value=io.BytesIO(b"x" * (MAX_BYTES + 1))):
            check("oversized_file_incomplete", review_file(virtual)["status"] == "UNKNOWN_SIZE_LIMIT")
        with patch.object(Path, "open") as reader:
            check("unsupported_type_incomplete", not review_file(Path("synthetic_case.txt"))["coverage_complete"])
            check("unsupported_type_not_read", reader.call_count == 0)
        with patch.object(Path, "open", return_value=io.BytesIO(b"run: echo example\n")):
            check("YAML_without_python_is_UNKNOWN", review_file(Path("synthetic.yml"))["status"] == "UNKNOWN_NO_PYTHON_HEREDOC")
        payload = b"run: |\n  python - <<'PY'\n  import requests\n  requests.post(url)\n  PY\n"
        with patch.object(Path, "open", return_value=io.BytesIO(payload)):
            item = review_file(Path("synthetic.yml"))
            check("YAML_with_python_still_partial", item["status"] == "PARTIAL_PYTHON_HEREDOC_REVIEW" and not item["coverage_complete"])
        with patch.object(Path, "open", return_value=io.BytesIO(b"mismatched baseline")):
            report = build_report([virtual], Path("baseline.yml"))
            check("baseline_mismatch_stops_comparison", report["status"] == "BASELINE_UNRESOLVED" and report["files"] == [])
    with patch.object(Path, "is_symlink", return_value=True), patch.object(Path, "open") as reader:
        check("symlink_incomplete", not review_file(virtual)["coverage_complete"])
        check("symlink_not_read", reader.call_count == 0)
    with patch.object(Path, "is_symlink", side_effect=PermissionError()):
        check("metadata_error_is_UNKNOWN", review_file(virtual)["status"] == "UNKNOWN_METADATA_ERROR")
    empty = build_report([])
    check("empty_targets_not_complete", not empty["coverage_complete"] and empty["files"] == [])
    check("report_does_not_determine_safety", empty["safe_or_approved_conclusion"] == "NOT_DETERMINED")
    failed = [item["name"] for item in tests if not item["passed"]]
    return {
        "status": "PASSED" if not failed else "FAILED",
        "tests_total": len(tests),
        "tests_passed": len(tests) - len(failed),
        "failed": failed,
        "tests": tests,
        "semantics": "Synthetic deterministic evidence checks only; not measured real-repository accuracy.",
        "target_code_executed": False,
    }


def main(argv: list[str] | None = None) -> int:
    parser = argparse.ArgumentParser(description=__doc__, formatter_class=argparse.RawDescriptionHelpFormatter)
    parser.add_argument("targets", nargs="*", type=Path, help="Explicit source files/directories; no default whole-repo scan")
    parser.add_argument("--self-test", action="store_true", help="Run deterministic synthetic parser/matcher checks")
    parser.add_argument("--baseline-workflow", type=Path, help="Optional byte-identity check against the uploaded baseline")
    arguments = parser.parse_args(argv)
    if arguments.self_test:
        result = self_test()
        print(json.dumps(result, ensure_ascii=False, indent=2))
        return 0 if result["status"] == "PASSED" else 1
    if not arguments.targets:
        parser.error("Supply source targets, or use --self-test.")
    report = build_report(arguments.targets, arguments.baseline_workflow)
    print(json.dumps(report, ensure_ascii=False, indent=2))
    return 0 if report["coverage_complete"] else 2


if __name__ == "__main__":
    raise SystemExit(main())
